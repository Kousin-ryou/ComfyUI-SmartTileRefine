name: Release
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy Pillow aiohttp
      - name: Test
        run: |
          python -m unittest discover -s tests -v
          node tests/test_preview.mjs
          node --check web/smart_tile_final.js
      - name: Build installable archive
        run: python scripts/package_release.py
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving its assets unchanged."
          else
            gh release create "v$VERSION" "dist/ComfyUI-SmartTileRefine-v$VERSION.zip" dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "v$VERSION · 分块高清重绘 / Smart Tile Refine" \
              --notes-file RELEASE_NOTES.md --latest
          fi
